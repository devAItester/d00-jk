<nav>
  <ul>
    <li><a href="{{ '/' | relative_url }}">index</a></li>
    {% assign parts = page.path | split: '/' %}
    {% assign section = parts[0] %}
    {% for p in site.pages %}
      {% assign pparts = p.path | split: '/' %}
      {% if pparts[0] == section and p.url != page.url %}
        <li><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
